name: CI to Docker Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      mediawiki_version:
        description: 'Only this MediaWiki major version (e.g. 1.43); empty = all'
        type: string
        default: ''
      php_version:
        description: 'Only this PHP version (e.g. 8.3); empty = all'
        type: string
        default: ''
      build_timestamp:
        description: 'Timestamp (UTC, YYYYMMDDTHHMM) for the immutable per-build tag; empty = now. Set by gesinn-it/docker-mediawiki-base so that a whole chain shares it'
        type: string
        default: ''
      dry_run:
        description: 'Build amd64 only: do not push images'
        type: boolean
        default: false

jobs:

  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # a manual run can be restricted to one MediaWiki / PHP version via the workflow_dispatch inputs
        mediawiki_version: ${{ fromJSON(inputs.mediawiki_version != '' && format('["{0}"]', inputs.mediawiki_version) || '["1.46", "1.43"]') }}
        target_repository: ['mediawiki', 'mediawiki-ci']
        php_version: ${{ fromJSON(inputs.php_version != '' && format('["{0}"]', inputs.php_version) || '["8.5", "8.4", "8.3"]') }}
        exclude:
          - mediawiki_version: '1.46'
            php_version: '8.3'
          - mediawiki_version: '1.43'
            php_version: '8.5'
          - mediawiki_version: '1.43'
            php_version: '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: ${{ !inputs.dry_run }}
        uses: docker/setup-qemu-action@v4

        # Docker setup
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache/${{ matrix.mediawiki_version }}/php${{ matrix.php_version }}
          key: ${{ runner.os }}-buildx-${{ matrix.mediawiki_version }}-${{ matrix.php_version }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.mediawiki_version }}-
            ${{ runner.os }}-buildx-


      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Env setup
      - name: Retrieve MediaWiki version
        run: |
          source ./helpers.sh
          mw_ref="$(mediawiki_ref ${{ matrix.mediawiki_version }})"
          IFS=':' read -r mw_type mw_value mw_sha <<< "$mw_ref"
          echo "MEDIAWIKI_REF_TYPE=${mw_type}" >> $GITHUB_ENV
          if [[ "$mw_type" == "tag" ]]; then
            echo "MEDIAWIKI_FULL_VERSION=${mw_value}" >> $GITHUB_ENV
          else
            echo "MEDIAWIKI_FULL_VERSION=${{ matrix.mediawiki_version }}-dev-${mw_sha:0:7}" >> $GITHUB_ENV
          fi

      - name: Set default PHP for this MediaWiki version
        run: |
          case "${{ matrix.mediawiki_version }}" in
            1.46) echo "PHP_DEFAULT=8.4" >> $GITHUB_ENV ;;
            1.43) echo "PHP_DEFAULT=8.3" >> $GITHUB_ENV ;;
            *)    echo "PHP_DEFAULT=8.3" >> $GITHUB_ENV ;;
          esac

      - name: Set Xdebug version
        run: |
          case "${{ matrix.php_version }}" in
            8.5) echo "XDEBUG_VERSION=3.5.1" >> $GITHUB_ENV ;;
            8.4) echo "XDEBUG_VERSION=3.4.7" >> $GITHUB_ENV ;;
            *)   echo "XDEBUG_VERSION=3.3.2" >> $GITHUB_ENV ;;
          esac

      # single source of truth: the ARG defaults in the Dockerfile (kept up to date by Renovate)
      - name: Read pinned versions from Dockerfile
        run: |
          for name in COMPOSER_VERSION MEDIAWIKI_TOOLS_VERSION; do
            value="$(sed -n "s/^ *ARG ${name}=//p" Dockerfile)"
            if [[ -z "$value" ]]; then
              echo "ARG ${name} not found in Dockerfile" >&2
              exit 1
            fi
            echo "${name}=${value}" >> $GITHUB_ENV
          done

      - name: Resolve base image
        run: |
          base="gesinn/mediawiki-base:${MEDIAWIKI_FULL_VERSION}-php${{ matrix.php_version }}-apache"
          digest="$(docker buildx imagetools inspect "$base" --format '{{.Manifest.Digest}}')"
          # effective PHP version (e.g. 8.2.35) as recorded in the base image, falls back to the matrix value
          php_full="$(docker buildx imagetools inspect "$base" --format '{{index .Manifest.Annotations "it.gesinn.php.version"}}' 2>/dev/null || true)"
          if [[ -z "$php_full" || "$php_full" == "<no value>" ]]; then
            php_full="${{ matrix.php_version }}"
          fi
          echo "BASE_IMAGE=${base}" >> $GITHUB_ENV
          echo "BASE_DIGEST=${digest}" >> $GITHUB_ENV
          echo "PHP_FULL_VERSION=${php_full}" >> $GITHUB_ENV

      - name: Set build metadata
        env:
          INPUT_BUILD_TIMESTAMP: ${{ inputs.build_timestamp }}
        run: |
          timestamp="${INPUT_BUILD_TIMESTAMP:-$(date -u +%Y%m%dT%H%M)}"
          if [[ ! "$timestamp" =~ ^[0-9]{8}T[0-9]{4}$ ]]; then
            echo "build_timestamp must look like 20261021T0933, got: ${timestamp}" >&2
            exit 1
          fi
          echo "BUILD_TIMESTAMP=${timestamp}" >> $GITHUB_ENV
          echo "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: generate tags for image
        run: |
          source ./helpers.sh
          echo "TAGS=$(generate_tags \
            gesinn/${{ matrix.target_repository }} \
            ${{ env.MEDIAWIKI_FULL_VERSION }} \
            ${{ matrix.mediawiki_version }} \
            ${{ matrix.php_version }} \
            ${{ env.PHP_DEFAULT }} \
            ${{ env.MEDIAWIKI_REF_TYPE }} \
            ${{ env.BUILD_TIMESTAMP }})" >> $GITHUB_ENV

      # Build once for linux/amd64 and load the image, to read the versions of the packages
      # the Dockerfile adds on top of the base image. The final build below reuses its layers.
      - name: Build image for inspection
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          network: host
          allow: network.host
          build-args: |
            MEDIAWIKI_VERSION=${{ env.MEDIAWIKI_FULL_VERSION }}
            PHP_VERSION=${{ matrix.php_version }}
            XDEBUG_VERSION=${{ env.XDEBUG_VERSION }}
            MEDIAWIKI_BASE_DIGEST=@${{ env.BASE_DIGEST }}
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          pull: true
          tags: inspect:local
          target: ${{ matrix.target_repository }}
          platforms: linux/amd64
          cache-from: type=local,src=/tmp/.buildx-cache/${{ matrix.mediawiki_version }}/php${{ matrix.php_version }}

      - name: Read package versions from the image
        run: |
          source ./helpers.sh
          labels=""
          annotations=""
          for pkg in "${INSTALLED_PACKAGES[@]}"; do
            # packages that this image target does not install (e.g. libpq-dev in mediawiki) are skipped
            version="$(docker run --rm --entrypoint dpkg-query inspect:local -W -f='${Version}' "$pkg" 2>/dev/null)" || continue
            [[ -n "$version" ]] || continue
            labels+="it.gesinn.${pkg}.version=${version}"$'\n'
            annotations+="index:it.gesinn.${pkg}.version=${version}"$'\n'
          done
          {
            echo "PACKAGE_LABELS<<PACKAGE_LABELS_EOF"
            printf '%s' "$labels"
            echo "PACKAGE_LABELS_EOF"
            echo "PACKAGE_ANNOTATIONS<<PACKAGE_ANNOTATIONS_EOF"
            printf '%s' "$annotations"
            echo "PACKAGE_ANNOTATIONS_EOF"
          } >> $GITHUB_ENV
          printf '%s' "$labels"

      # Image build
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          network: host
          allow: network.host
          build-args: |
            MEDIAWIKI_VERSION=${{ env.MEDIAWIKI_FULL_VERSION }}
            PHP_VERSION=${{ matrix.php_version }}
            XDEBUG_VERSION=${{ env.XDEBUG_VERSION }}
            MEDIAWIKI_BASE_DIGEST=@${{ env.BASE_DIGEST }}
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ !inputs.dry_run }}
          pull: true
          tags: ${{ env.TAGS }}
          target: ${{ matrix.target_repository }}
          cache-from: type=local,src=/tmp/.buildx-cache/${{ matrix.mediawiki_version }}/php${{ matrix.php_version }}
          cache-to: type=local,dest=/tmp/.buildx-cache/${{ matrix.mediawiki_version }}/php${{ matrix.php_version }},mode=max
          # a dry run only builds amd64 (no QEMU emulation), which is much faster
          platforms: ${{ inputs.dry_run && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          labels: |
            org.opencontainers.image.base.name=docker.io/${{ env.BASE_IMAGE }}
            org.opencontainers.image.base.digest=${{ env.BASE_DIGEST }}
            org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.MEDIAWIKI_FULL_VERSION }}
            it.gesinn.mediawiki.version=${{ env.MEDIAWIKI_FULL_VERSION }}
            it.gesinn.php.version=${{ env.PHP_FULL_VERSION }}
            it.gesinn.composer.version=${{ env.COMPOSER_VERSION }}
            ${{ matrix.target_repository == 'mediawiki-ci' && format('it.gesinn.xdebug.version={0}', env.XDEBUG_VERSION) || '' }}
            ${{ matrix.target_repository == 'mediawiki-ci' && format('it.gesinn.tools.version={0}', env.MEDIAWIKI_TOOLS_VERSION) || '' }}
            ${{ env.PACKAGE_LABELS }}
          annotations: |
            index:org.opencontainers.image.base.name=docker.io/${{ env.BASE_IMAGE }}
            index:org.opencontainers.image.base.digest=${{ env.BASE_DIGEST }}
            index:org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ env.MEDIAWIKI_FULL_VERSION }}
            index:it.gesinn.mediawiki.version=${{ env.MEDIAWIKI_FULL_VERSION }}
            index:it.gesinn.php.version=${{ env.PHP_FULL_VERSION }}
            index:it.gesinn.composer.version=${{ env.COMPOSER_VERSION }}
            ${{ matrix.target_repository == 'mediawiki-ci' && format('index:it.gesinn.xdebug.version={0}', env.XDEBUG_VERSION) || '' }}
            ${{ matrix.target_repository == 'mediawiki-ci' && format('index:it.gesinn.tools.version={0}', env.MEDIAWIKI_TOOLS_VERSION) || '' }}
            ${{ env.PACKAGE_ANNOTATIONS }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  # The version table in the README is generated from the labels of the published images.
  # Only on main: a manual run from another branch must not commit there.
  update-readme:
    needs: build
    if: needs.build.result == 'success' && !inputs.dry_run && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Update version table
        run: ./update_readme_table.sh

      - name: Commit
        run: |
          if git diff --quiet -- README.md; then
            echo "README version table is up to date" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update version table [skip ci]" README.md
          git pull --rebase
          git push

  cleanup-dev-tags:
    runs-on: ubuntu-24.04
    needs: build
    if: needs.build.result == 'success' && !inputs.dry_run
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mediawiki_version: ['1.46', '1.43']
        target_repository: ['mediawiki', 'mediawiki-ci']
    env:
      IMAGE_NAMESPACE: gesinn
      IMAGE_REPOSITORY: ${{ matrix.target_repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup old dev images
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          source ./helpers.sh

          hub_api="https://hub.docker.com/v2"
          hub_repo="${hub_api}/repositories/${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}"

          auth_payload="$(jq -cn --arg u "$DOCKER_HUB_USERNAME" --arg p "$DOCKER_HUB_ACCESS_TOKEN" '{username:$u,password:$p}')"
          hub_jwt="$(curl -fsSL -H 'Content-Type: application/json' -X POST "${hub_api}/users/login/" -d "$auth_payload" | jq -r '.token')"

          if [[ -z "$hub_jwt" || "$hub_jwt" == "null" ]]; then
            echo "Failed to authenticate against Docker Hub API" >&2
            exit 1
          fi

          tags_file="$(mktemp)"
          page_url="${hub_repo}/tags?page_size=100"
          while [[ -n "$page_url" && "$page_url" != "null" ]]; do
            page_json="$(curl -fsSL -H "Authorization: JWT ${hub_jwt}" "$page_url")"
            jq -r '.results[] | [.name, .last_updated] | @tsv' <<< "$page_json" >> "$tags_file"
            page_url="$(jq -r '.next' <<< "$page_json")"
          done

          if [[ ! -s "$tags_file" ]]; then
            echo "No tags found in repository ${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}; nothing to clean up."
            exit 0
          fi

          major="${{ matrix.mediawiki_version }}"

          # Immutable per-build tags (<version>-php<v>-YYYYMMDDTHHMM): keep the latest 8 per MediaWiki major + PHP version.
          # Runs first because the dev cleanup below exits early when there is nothing to do.
          mapfile -t old_build_tags < <(
            awk -F '\t' -v m="$major" -v d8='[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]' -v d4='[0-9][0-9][0-9][0-9]' '
              match($1, "^" m "[.-].*-php[0-9.]+-" d8 "T" d4 "$") {
                tag = $1
                ts = substr(tag, length(tag) - 12)
                prefix = substr(tag, 1, length(tag) - 14)
                sub(/^.*-php/, "", prefix)
                print prefix "\t" ts "\t" tag
              }
            ' "$tags_file" | sort -t $'\t' -k1,1 -k2,2r | awk -F '\t' '{ if (++n[$1] > 8) print $3 }'
          )
          for tag_name in "${old_build_tags[@]}"; do
            echo "Deleting ${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}:${tag_name} (retention: latest 8 build tags)"
            curl -fsSL -X DELETE -H "Authorization: JWT ${hub_jwt}" "${hub_repo}/tags/${tag_name}/" > /dev/null || true
          done
          ref_info="$(mediawiki_ref "$major")"
          IFS=':' read -r ref_type _ _ <<< "$ref_info"

          mapfile -t dev_build_keys < <(
            awk -v m="$major" -F '\t' '
              $1 ~ ("^" m "-dev-[0-9a-f]{7}(-|$)") {
                if (match($1, "^" m "-dev-[0-9a-f]{7}")) {
                  key = substr($1, RSTART, RLENGTH)
                  print key
                }
              }
            ' "$tags_file" | sort -u
          )

          if [[ ${#dev_build_keys[@]} -eq 0 ]]; then
            echo "No dev tag groups for ${major} in ${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}; skipping."
            exit 0
          fi

          mapfile -t sorted_groups < <(
            awk -v m="$major" -F '\t' '
              $1 ~ ("^" m "-dev-[0-9a-f]{7}(-|$)") {
                if (match($1, "^" m "-dev-[0-9a-f]{7}")) {
                  key = substr($1, RSTART, RLENGTH)
                  ts = $2
                  if (!(key in latest) || ts > latest[key]) {
                    latest[key] = ts
                  }
                }
              }
              END {
                for (k in latest) {
                  print latest[k] "\t" k
                }
              }
            ' "$tags_file" | sort -r | awk -F '\t' '{print $2}'
          )

          delete_from_index=0
          if [[ "$ref_type" == "tag" ]]; then
            echo "Stable tag available for ${major}; deleting all dev build groups (${#sorted_groups[@]}) in ${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}."
          else
            delete_from_index=5
            if [[ ${#sorted_groups[@]} -le 5 ]]; then
              echo "${major} remains in dev mode for ${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}; ${#sorted_groups[@]} groups <= 5, nothing to delete."
              exit 0
            fi
            echo "${major} remains in dev mode for ${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}; deleting groups older than latest 5 (total ${#sorted_groups[@]})."
          fi

          for ((i = delete_from_index; i < ${#sorted_groups[@]}; i++)); do
            group="${sorted_groups[$i]}"
            mapfile -t tags_to_delete < <(awk -v g="$group" -F '\t' '$1 ~ ("^" g "(-|$)") {print $1}' "$tags_file")
            for tag_name in "${tags_to_delete[@]}"; do
              echo "Deleting ${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}:${tag_name}"
              curl -fsSL -X DELETE -H "Authorization: JWT ${hub_jwt}" "${hub_repo}/tags/${tag_name}/" > /dev/null
            done
          done
